document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"c7af2550-3377-4c22-9bae-85dcf39582df\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n\n<helmet>\n<style>\n  body { margin: 0; background: #F5F6F7; }\n  ::-webkit-scrollbar { width: 8px; height: 8px; }\n  ::-webkit-scrollbar-thumb { background: #D8DCE1; border-radius: 4px; }\n  a { color: #96222F; }\n  a:hover { color: #7A1B27; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; color: #1F2937; width: 100%; min-height: 100vh; background: #F5F6F7;\">\n\n<sc-if value=\"{{ isLogin }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"display: flex; min-height: 100vh; width: 100%;\">\n    <div style=\"width: 42%; min-width: 380px; background: #7A1B27; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 48px;\">\n      <img src=\"90ce7e1b-ac53-4f09-bb1a-8ceba48cd8e8\" alt=\"Smart Blood Bank\" style=\"width: 84px; height: auto;\">\n      <div style=\"text-align: center;\">\n        <div style=\"font-size: 28px; font-weight: 700; color: #FFFFFF; letter-spacing: 0.5px;\">Smart <span style=\"color: #FF9FA8;\">Blood<\u002Fspan> Bank<\u002Fdiv>\n        <div style=\"font-size: 13px; font-weight: 600; color: #F0C9CE; letter-spacing: 2px; margin-top: 6px;\">MANAGEMENT SYSTEM<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"max-width: 320px; text-align: center; font-size: 14px; color: #F0C9CE; line-height: 1.6; margin-top: 8px;\">\n        Real-time donor, patient and inventory management for hospital blood banks.\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex: 1; display: flex; align-items: center; justify-content: center; background: #FFFFFF;\">\n      <div style=\"width: 100%; max-width: 380px; padding: 32px;\">\n        <div style=\"font-size: 22px; font-weight: 700; color: #1F2937;\">Sign in<\u002Fdiv>\n        <div style=\"font-size: 14px; color: #6B7280; margin-top: 6px;\">Authorized personnel only<\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 18px; margin-top: 32px;\">\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <label style=\"font-size: 13px; font-weight: 600; color: #374151;\">Username<\u002Flabel>\n            <input type=\"text\" placeholder=\"e.g. r.mehta\" value=\"{{ username }}\" sc-camel-on-change=\"{{ onUsernameChange }}\" style=\"border: 1px solid #D1D5DB; border-radius: 8px; padding: 11px 12px; font-size: 14px; color: #1F2937; outline: none;\">\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n            <label style=\"font-size: 13px; font-weight: 600; color: #374151;\">Password<\u002Flabel>\n            <input type=\"password\" placeholder=\"••••••••\" value=\"{{ password }}\" sc-camel-on-change=\"{{ onPasswordChange }}\" style=\"border: 1px solid #D1D5DB; border-radius: 8px; padding: 11px 12px; font-size: 14px; color: #1F2937; outline: none;\">\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ doLogin }}\" style=\"margin-top: 8px; background: #96222F; color: #FFFFFF; border: none; border-radius: 8px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer;\" style-hover=\"background: #7A1B27;\">Sign In<\u002Fbutton>\n          <div style=\"font-size: 12px; color: #9CA3AF; text-align: center; margin-top: 4px;\">Access is limited to verified hospital staff and administrators.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isLoggedIn }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"display: flex; min-height: 100vh; width: 100%;\">\n\n    <div style=\"width: 264px; min-width: 264px; background: #1F242C; display: flex; flex-direction: column; padding: 20px 14px;\">\n      <div style=\"display: flex; align-items: center; gap: 10px; padding: 8px 10px 22px 10px;\">\n        <img src=\"90ce7e1b-ac53-4f09-bb1a-8ceba48cd8e8\" alt=\"logo\" style=\"width: 30px; height: auto;\">\n        <div>\n          <div style=\"font-size: 14px; font-weight: 700; color: #FFFFFF; line-height: 1.2;\">Smart Blood Bank<\u002Fdiv>\n          <div style=\"font-size: 10px; font-weight: 600; color: #9AA1AC; letter-spacing: 1px;\">MANAGEMENT SYSTEM<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 2px; margin-top: 8px;\">\n        <sc-for list=\"{{ navItems }}\" as=\"item\" hint-placeholder-count=\"7\">\n          <div sc-camel-on-click=\"{{ item.onClick }}\" style=\"{{ item.rowStyle }}\">\n            <span style=\"{{ item.dotStyle }}\"><\u002Fspan>\n            <span style=\"flex: 1;\">{{ item.label }}<\u002Fspan>\n            <sc-if value=\"{{ item.soon }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-size: 10px; font-weight: 700; color: #6B7280; background: #2A3038; border-radius: 4px; padding: 2px 6px;\">SOON<\u002Fspan>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"flex: 1;\"><\u002Fdiv>\n      <div style=\"border-top: 1px solid #2A3038; padding-top: 14px; display: flex; align-items: center; gap: 10px; padding-left: 10px;\">\n        <div style=\"width: 32px; height: 32px; border-radius: 50%; background: #96222F; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700;\">RM<\u002Fdiv>\n        <div>\n          <div style=\"font-size: 13px; font-weight: 600; color: #FFFFFF;\">Dr. R. Mehta<\u002Fdiv>\n          <div style=\"font-size: 11px; color: #9AA1AC;\">Administrator<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex: 1; display: flex; flex-direction: column; min-width: 0;\">\n      <div style=\"height: 64px; min-height: 64px; b  font-weight: 600; margin-top: 2px;\">{{ selected.unitsNeeded }}<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"color: #9CA3AF; font-size: 11px; font-weight: 700;\">WARD<\u002Fdiv><div style=\"color: #1F2937; font-weight: 600; margin-top: 2px;\">{{ selected.ward }}<\u002Fdiv><\u002Fdiv>\n                <div><div style=\"color: #9CA3AF; font-size: 11px; font-weight: 700;\">REQUESTED BY<\u002Fdiv><div style=\"color: #1F2937; font-weight: 600; margin-top: 2px;\">{{ selected.requestedBy }}<\u002Fdiv><\u002Fdiv>\n                <div style=\"grid-column: span 2;\"><div style=\"color: #9CA3AF; font-size: 11px; font-weight: 700;\">REASON<\u002Fdiv><div style=\"color: #1F2937; font-weight: 600; margin-top: 2px;\">{{ selected.reason }}<\u002Fdiv><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size: 13px; font-weight: 700; color: #1F2937; margin-bottom: 8px;\">Suggested Compatible Bags (FIFO)<\u002Fdiv>\n              <div style=\"border: 1px solid #E5E7EB; border-radius: 8px; overflow: hidden;\">\n                <sc-for list=\"{{ selected.suggestedBags }}\" as=\"b\" hint-placeholder-count=\"3\">\n                  <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid #F1F2F4;\">\n                    <div>\n                      <div style=\"font-size: 13px; font-weight: 600; color: #1F2937;\">{{ b.id }} · {{ b.type }}<\u002Fdiv>\n                      <div style=\"font-size: 11px; color: #9CA3AF;\">Expiry {{ b.expiry }}<\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"font-size: 12px; font-weight: 700; color: #B98900;\">{{ b.expiryLabel }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ isReports }}\" hint-placeholder-val=\"{{ false }}\">\n          <div>\n            <div style=\"display: ', collected: '25 Jul 2026', expiry: '05 Sep 2026', expiresIn: 40, status: 'Available', donorId: 'DN-1210' },\n      { id: 'BT-2318', volume: '450 ml', collected: '26 Jul 2026', expiry: '06 Sep 2026', expiresIn: 41, status: 'Reserved', donorId: 'DN-1215' },\n    ]},\n  ];\n\n  statusStyle(status) {\n    const map = {\n      Available: { bg: '#EAF7EF', fg: '#1E8E5A', border: '#BFE8CE' },\n      Reserved: { bg: '#FDF3E0', fg: '#B98900', border: '#F5DFA6' },\n      Used: { bg: '#EEF0F2', fg: '#5B6472', border: '#DCE0E4' },\n      Expired: { bg: '#FCEAEC', fg: '#96222F', border: '#F3C9CF' },\n    };\n    const c = map[status] || map.Used;\n    return `font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 20px; background: ${c.bg}; color: ${c.fg}; border: 1px solid ${c.border};`;\n  }\n\n  expiryLabelAndStyle(days, status) {\n    if (status === 'Expired') return { label: `Expired ${Math.abs(days)}d ago`, style: 'font-size: 13px; font-weight: 600; color: #96222F;' };\n    if (days === 0) return { label: 'Expires today', style: 'font-size: 13px; font-weight: 700; color: #96222F;' };\n    if (days <= 3) return { label: `Expires in ${days}d`, style: 'font-size: 13px; font-weight: 700; color: #B98900;' };\n    return { label: `Expires in ${days}d`, style: 'font-size: 13px; color: #4B5563;' };\n  }\n\n  goToScreen(key) { this.setState({ screen: key }); }\n\n  openAddDonor() { this.setState({ donorFormOpen: true, donorForm: this.blankDonorForm() }); }\n  openEditDonor(donor) { this.setState({ donorFormOpen: true, donorForm: { ...donor } }); }\n  closeDonorForm() { this.setState({ donorFormOpen: false, donorForm: null }); }\n  updateDonorField(key, value) { this.setState(s => ({ donorForm: { ...s.donorForm, [key]: value } })); }\n\n  openAddPatient() { this.setState({ patientFormOpen: true, patientForm: this.blankPatientForm() }); }\n  openEditPatient(patient) { this.setState({ patientFormOpen: true, patientForm: { ...patient } }); }\n  closePatientForm() { this.setState({ patientFormOpen: false, patientForm: null }); }\n  updatePatientField(key, value) { this.setState(s => ({ patientForm: { ...s.patientForm, [key]: value } })); }\n\n  toggleNotif(key) { this.setState(s => ({ notifToggles: { ...s.notifToggles, [key]: !s.notifToggles[key] } })); }\n\n  selectRequest(id) { this.setState({ selectedRequestId: id }); }\n  setRequestStatus(id, status) {\n    this.setState(s => ({ requests: (s.requests || this.requestsSeed).map(r => r.id === id ? { ...r, status } : r) }));\n  }\n\n  renderVals() {\n    const { screen, username, password } = this.state;\n    const isLogin = screen === 'login';\n    const isLoggedIn = !isLogin;\n\n    const titles = {\n      dashboard: 'Dashboard', donors: 'Donor Management', patients: 'Patient Management',\n      inventory: 'Blood Inventory', emergency: 'Emergency Requests', reports: 'Reports', settings: 'Settings',\n    };\n\n    const navItems = this.navConfig.map(item => {\n      const isBuilt = this.builtScreens.includes(item.key);\n      const isActive = screen === item.key;\n      const rowStyle = `display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: ${isBuilt ? 'pointer' : 'default'}; color: ${isActive ? '#FFFFFF' : (isBuilt ? '#C7CCD3' : '#5A6270')}; background: ${isActive ? '#96222F' : 'transparent'};`;\n      const dotStyle = `width: 7px; height: 7px; border-radius: 50%; background: ${isActive ? '#FFFFFF' : (isBuilt ? '#6B7280' : '#3A414C')};`;\n      return { ...item, onClick: isBuilt ? () => this.goToScreen(item.key) : undefined, soon: !isBuilt, rowStyle, dotStyle };\n    });\n\n    const kpis = [\n      { label: 'Total Donors', value: '1,248', subtitle: 'Registered donors', cardStyle: 'background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px; padding: 18px 20px;', valueStyle: 'font-size: 30px; font-weight: 800; color: #1F2937; margin-top: 6px;' },\n      { label: 'Total Patients', value: '342', subtitle: 'Active patient records', cardStyle: 'background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px; padding: 18px 20px;', valueStyle: 'font-size: 30px; font-weight: 800; color: #1F2937; margin-top: 6px;' },\n      { label: 'Available Units', value: '173', subtitle: 'Across 8 blood types', cardStyle: 'background: #FFFFFF; border: 1px solid #E5E7EB; border-radius: 12px; padding: 18px 20px;', valueStyle: 'font-size: 30px; font-weight: 800; color: #1F2937; margin-top: 6px;' },\n      { label: 'Critical Alerts', value: '7', subtitle: 'Low stock + expiring soon', cardStyle: 'background: #FCEAEC; border: 1px solid #F3C9CF; border-radius: 12px; padding: 18px 20px;', valueStyle: 'font-size: 30px; font-weight: 800; color: #96222F; margin-top: 6px;' },\n    ];\n\n    const bloodTypeCards = this.bloodTypeData.map(bt => {\n      const colors = { normal: '#1F2937', low: '#B98900', critical: '#96222F' };\n      const tagMap = {\n        normal: { label: 'OK', style: 'font-size: 10px; font-weight: 700; margin-top: 8px; color: #1E8E5A; background: #EAF7EF; border-radius: 6px; padding: 2px 6px; display: inline-block;' },\n        low: { label: 'LOW', style: 'font-size: 10px; font-weight: 700; margin-top: 8px; color: #B98900; background: #FDF3E0; border-radius: 6px; padding: 2px 6px; display: inline-block;' },\n        critical: { label: 'CRITICAL', style: 'font-size: 10px; font-weight: 700; margin-top: 8px; color: #96222F; background: #FCEAEC; border-radius: 6px; padding: 2px 6px; display: inline-block;' },\n      };\n      const tag = tagMap[bt.status];\n      const border = bt.status === 'critical' ? '#F3C9CF' : bt.status === 'low' ? '#F5DFA6' : '#E5E7EB';\n      return {\n        type: bt.type, units: bt.units,\n        cardStyle: `background: #FFFFFF; border: 1px solid ${border}; border-radius: 10px; padding: 14px; text-align: center;`,\n        numberColor: `color: ${colors[bt.status]};`,\n        tagLabel: tag.label, tagStyle: tag.style,\n      };\n    });\n\n    const lowStockAlerts = this.lowStockData.map(row => ({\n      type: row.type, units: row.units, severity: row.severity,\n      dotStyle: `width: 8px; height: 8px; border-radius: 50%; background: ${row.severity === 'Critical' ? '#96222F' : '#B98900'};`,\n      tagStyle: `font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; color: ${row.severity === 'Critical' ? '#96222F' : '#B98900'}; background: ${row.severity === 'Critical' ? '#FCEAEC' : '#FDF3E0'};`,\n    }));\n\n    const expiringSoon = this.expiringSoonData.map(row => ({\n      ...row,\n      tagStyle: `font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; color: #96222F; background: #FCEAEC;`,\n    }));\n\n    const inventoryGroups = this.inventoryData.map(grp => ({\n      type: grp.type,\n      count: grp.units.length,\n      units: grp.units.map(u => {\n        const ex = this.expiryLabelAndStyle(u.expiresIn, u.status);\n        return { ...u, expiryLabel: ex.label, expiryStyle: ex.style, statusStyle: this.statusStyle(u.status) };\n      }),\n    }));\n\n    const donorRows = this.donorsData.map(d => ({\n      ...d,\n      eligibilityLabel: d.eligible ? 'Eligible' : `From ${d.eligibleFrom}`,\n      eligibilityStyle: `font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; color: ${d.eligible ? '#1E8E5A' : '#B98900'}; background: ${d.eligible ? '#EAF7EF' : '#FDF3E0'};`,\n      onEdit: () => this.openEditDonor(d),\n    }));\n\n    const donorForm = this.state.donorForm || this.blankDonorForm();\n    const donorFieldHandlers = {\n      name: e => this.updateDonorField('name', e.target.value),\n      bloodType: e => this.updateDonorField('bloodType', e.target.value),\n      dob: e => this.updateDonorField('dob', e.target.value),\n      phone: e => this.updateDonorField('phone', e.target.value),\n      email: e => this.updateDonorField('email', e.target.value),\n      lastDonation: e => this.updateDonorField('lastDonation', e.target.value),\n      address: e => this.updateDonorField('address', e.target.value),\n    };\n\n    const patientRows = this.patientsData.map(p => ({\n      ...p,\n      emergencyStyle: this.emergencyStyle(p.emergencyLevel),\n      onEdit: () => this.openEditPatient(p),\n    }));\n\n    const patientForm = this.state.patientForm || this.blankPatientForm();\n    const patientFieldHandlers = {\n      name: e => this.updatePatientField('name', e.target.value),\n      bloodType: e => this.updatePatientField('bloodType', e.target.value),\n      ageGender: e => this.updatePatientField('ageGender', e.target.value),\n      phone: e => this.updatePatientField('phone', e.target.value),\n      ward: e => this.updatePatientField('ward', e.target.value),\n      admitted: e => this.updatePatientField('admitted', e.target.value),\n      emergencyLevel: e => this.updatePatientField('emergencyLevel', e.target.value),\n    };\n\n    const requests = [...(this.state.requests || this.requestsSeed)].sort((a, b) => this.priorityRank[a.priority] - this.priorityRank[b.priority]);\n    const selectedId = this.state.selectedRequestId || requests[0].id;\n\n    const requestRows = requests.map(r => {\n      const isCritical = r.priority === 'Critical';\n      const isSelected = r.id === selectedId;\n      const priorityColors = {\n        Critical: { bg: '#FCEAEC', fg: '#96222F' }, High: { bg: '#FDEEE0', fg: '#C2650A' },\n        Medium: { bg: '#FDF3E0', fg: '#B98900' }, Low: { bg: '#EAF7EF', fg: '#1E8E5A' },\n      };\n      const statusColors = {\n        Pending: { bg: '#F1F2F4', fg: '#5B6472' }, Approved: { bg: '#E6EEF7', fg: '#2C5A8C' },\n        Fulfilled: { bg: '#EAF7EF', fg: '#1E8E5A' }, Rejected: { bg: '#FCEAEC', fg: '#96222F' },\n      };\n      const pc = priorityColors[r.priority];\n      const sc = statusColors[r.status];\n      return {\n        ...r,\n        isPending: r.status === 'Pending',\n        priorityStyle: `font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; color: ${pc.fg}; background: ${pc.bg};`,\n        statusStyle: `font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; color: ${sc.fg}; background: ${sc.bg};`,\n        cardStyle: `background: ${isCritical ? '#FEF7F8' : '#FFFFFF'}; border: 1px solid ${isSelected ? '#96222F' : (isCritical ? '#F3C9CF' : '#E5E7EB')}; border-left: 4px solid ${isCritical ? '#96222F' : (isSelected ? '#96222F' : '#E5E7EB')}; border-radius: 10px; padding: 16px; margin-bottom: 12px; cursor: pointer;`,\n        onSelect: () => this.selectRequest(r.id),\n        onApprove: (e) => { e.stopPropagation(); this.setRequestStatus(r.id, 'Approved'); },\n        onFulfill: (e) => { e.stopPropagation(); this.setRequestStatus(r.id, 'Fulfilled'); },\n        onReject: (e) => { e.stopPropagation(); this.setRequestStatus(r.id, 'Rejected'); },\n      };\n    });\n\n    const selectedRaw = requests.find(r => r.id === selectedId) || requests[0];\n    const selected = { ...selectedRaw, suggestedBags: this.suggestBags(selectedRaw.bloodType) };\n\n    return {\n      isLogin, isLoggedIn,\n      isDashboard: screen === 'dashboard',\n      isInventory: screen === 'inventory',\n      isDonors: screen === 'donors',\n      isPatients: screen === 'patients',\n      isEmergency: screen === 'emergency',\n      criticalCount: requests.filter(r => r.priority === 'Critical').length,\n      pendingCount: requests.filter(r => r.status === 'Pending').length,\n      requestRows, selected,\n      isReports: screen === 'reports',\n      reportKpis: [\n        { label: 'Donations (MTD)', value: '142', subtitle: 'Units collected this month' },\n        { label: 'Requests Fulfilled', value: '96%', subtitle: 'Fulfillment rate, last 30 days' },\n        { label: 'Avg. Fulfillment Time', value: '18 min', subtitle: 'From approval to dispatch' },\n        { label: 'Expiry Wastage Rate', value: '4.2%', subtitle: 'Units expired before use' },\n      ],\n      donationMonths: (() => {\n        const max = Math.max(...this.donationMonthsData.map(m => m.value));\n        return this.donationMonthsData.map(m => ({\n          ...m,\n          barStyle: `width: 36px; height: ${Math.round((m.value / max) * 130)}px; background: #96222F; border-radius: 6px 6px 0 0;`,\n        }));\n      })(),\n      outcomeSegments: (() => {\n        const counts = { Pending: 0, Approved: 0, Fulfilled: 0, Rejected: 0 };\n        this.requestsSeed.forEach(r => { counts[r.status] = (counts[r.status] || 0) + 1; });\n        const colors = { Pending: '#9CA3AF', Approved: '#2C5A8C', Fulfilled: '#1E8E5A', Rejected: '#96222F' };\n        const total = this.requestsSeed.length;\n        return Object.keys(counts).map(k => ({\n          label: k, count: counts[k],\n          segStyle: `flex: ${counts[k] || 0.0001}; background: ${colors[k]};`,\n          dotStyle: `width: 9px; height: 9px; border-radius: 50%; background: ${colors[k]};`,\n        }));\n      })(),\n      inventoryBars: (() => {\n        const max = Math.max(...this.bloodTypeData.map(b => b.units));\n        return this.bloodTypeData.map(b => ({\n          type: b.type, units: b.units,\n          fillStyle: `width: ${Math.round((b.units / max) * 100)}%; height: 100%; background: ${b.status === 'critical' ? '#96222F' : b.status === 'low' ? '#B98900' : '#96222F'}; opacity: ${b.status === 'normal' ? 1 : 0.85};`,\n        }));\n      })(),\n      isSettings: screen === 'settings',\n      notificationToggles: (() => {\n        const defs = [\n          { key: 'emailAlerts', label: 'Email Alerts', subtitle: 'Critical stock and expiry notices by email' },\n          { key: 'smsAlerts', label: 'SMS Alerts', subtitle: 'Text message alerts for critical requests' },\n          { key: 'lowStockAlerts', label: 'Low Stock Alerts', subtitle: 'Notify when a blood type falls below threshold' },\n          { key: 'expirySoonAlerts', label: 'Expiry Soon Alerts', subtitle: 'Notify for units expiring within the warning window' },\n        ];\n        const toggles = this.state.notifToggles;\n        return defs.map(d => {\n          const on = toggles[d.key];\n          return {\n            ...d,\n            trackStyle: `width: 38px; height: 22px; border-radius: 12px; background: ${on ? '#96222F' : '#D1D5DB'}; position: relative; cursor: pointer; transition: background 0.15s;`,\n            knobStyle: `width: 18px; height: 18px; border-radius: 50%; background: #FFFFFF; position: absolute; top: 2px; left: ${on ? '18px' : '2px'}; transition: left 0.15s;`,\n            onToggle: () => this.toggleNotif(d.key),\n          };\n        });\n      })(),\n      staffRows: this.staffData.map(s => ({\n        ...s,\n        statusStyle: `font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; color: ${s.status === 'Active' ? '#1E8E5A' : '#6B7280'}; background: ${s.status === 'Active' ? '#EAF7EF' : '#F1F2F4'};`,\n      })),\n      screenTitle: titles[screen] || 'Dashboard',\n      currentDate: '27 Jul 2026',\n      username, password,\n      onUsernameChange: e => this.setState({ username: e.target.value }),\n      onPasswordChange: e => this.setState({ password: e.target.value }),\n      doLogin: () => this.goToScreen('dashboard'),\n      navItems, kpis, bloodTypeCards, lowStockAlerts, expiringSoon, inventoryGroups,\n      donorRows, donorFormOpen: this.state.donorFormOpen, donorForm, donorFieldHandlers,\n      donorFormTitle: donorForm.id ? 'Edit Donor' : 'Add New Donor',\n      openAddDonor: () => this.openAddDonor(),\n      closeDonorForm: () => this.closeDonorForm(),\n      patientRows, patientFormOpen: this.state.patientFormOpen, patientForm, patientFieldHandlers,\n      patientFormTitle: patientForm.id ? 'Edit Patient' : 'Add New Patient',\n      openAddPatient: () => this.openAddPatient(),\n      closePatientForm: () => this.closePatientForm(),\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
